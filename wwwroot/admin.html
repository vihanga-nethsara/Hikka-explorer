<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Hikka Explorer</title><link rel="stylesheet" href="style.css">
<style>main{max-width:1000px;margin:auto}input,select,textarea{width:100%;padding:.5rem;border:1px solid #8aa;border-radius:6px;font:inherit}
label{display:block;font-weight:600;margin-top:.6rem}table{width:100%;border-collapse:collapse;background:#fff;margin-top:1rem}
td,th{padding:.5rem;border-bottom:1px solid #cfe0dd;text-align:left}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 1rem}
.ok{color:#0a6b2a}.bad{color:#b00020}.sm{padding:.25rem .6rem;font-size:.85rem}</style></head><body>
<header class="top"><a class="brand" href="/">Hikka Explorer - Admin</a><button id="out" class="pill" hidden>Log out</button></header>
<main><p id="m" role="status" style="font-weight:600"></p>
<section id="login"><h2>Administrator login</h2><label>Username<input id="u" autocomplete="username"></label>
<label>Password<input id="p" type="password" autocomplete="current-password"></label><p><button id="lb">Log in</button></p></section>
<section id="panel" hidden><h2 id="ft">Add a place</h2><div id="f" class="g"></div>
<p><button id="save">Save place</button> <button id="cancel" class="ghost">Clear form</button></p>
<h2>All places</h2><div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Category</th><th>km</th><th>Visible</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=[['Name','Name'],['Latitude','Latitude'],['Longitude','Longitude'],['DistanceKm','Distance from Hikkaduwa (km, max 25)'],['OpeningTimes','Opening times'],['VisitDuration','Time needed (e.g. 1-2 hours)'],['Facilities','Facilities (parking, washrooms)'],['EntranceFee','Entrance fee'],['ImagePath','Image path (e.g. images/galle-fort.jpg)']];
const T=[['Description','Description'],['TravelTips','Travel tips'],['VisitorInfo','Visitor info']];
let rows=[],cats=[],editId=null;
const msg=(t,ok)=>{$('#m').textContent=t||'';$('#m').className=ok?'ok':'bad'};
async function api(u,m,b){const r=await fetch(u,{method:m||'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});let d={};try{d=await r.json()}catch{}return{ok:r.ok,s:r.status,d}}
$('#f').innerHTML=F.map(([k,l])=>`<label>${l}<input id="f_${k}"></label>`).join('')+'<label>Category<select id="f_CategoryId"></select></label>'
 +T.map(([k,l])=>`<label style="grid-column:1/-1">${l}<textarea id="f_${k}" rows="2"></textarea></label>`).join('')
 +'<label><input type="checkbox" id="f_IsAvailable" checked style="width:auto"> Visible to tourists</label>';
function reset(){editId=null;$('#ft').textContent='Add a place';F.concat(T).forEach(([k])=>$('#f_'+k).value='');$('#f_IsAvailable').checked=true}
async function load(){const r=await api('/api/admin/attractions');
 if(r.s===401){$('#login').hidden=false;$('#panel').hidden=true;$('#out').hidden=true;return}
 rows=r.d;$('#login').hidden=true;$('#panel').hidden=false;$('#out').hidden=false;
 if(!cats.length){cats=(await api('/api/categories')).d;$('#f_CategoryId').innerHTML=cats.map(c=>`<option value="${c.CategoryId}">${esc(c.Name)}</option>`).join('')}
 $('#rows').innerHTML=rows.map(a=>`<tr><td>${esc(a.Name)}</td><td>${esc(cats.find(c=>c.CategoryId==a.CategoryId)?.Name)}</td><td>${a.DistanceKm??''}</td><td>${a.IsAvailable?'Yes':'No'}</td>
 <td><button class="sm" data-e="${a.AttractionId}">Edit</button> <button class="sm ghost" data-x="${a.AttractionId}">Delete</button></td></tr>`).join('')}
$('#lb').onclick=async()=>{const r=await api('/api/admin/login','POST',{Username:$('#u').value,Password:$('#p').value});
 msg(r.d.message,r.ok);if(r.ok){$('#p').value='';load()}};
$('#out').onclick=async()=>{await api('/api/admin/logout','POST');msg('Logged out.',true);load()};
$('#cancel').onclick=reset;
$('#save').onclick=async()=>{const g=k=>$('#f_'+k).value.trim(),n=k=>g(k)===''?null:Number(g(k));
 const b={Name:g('Name'),CategoryId:+$('#f_CategoryId').value,Description:g('Description'),Latitude:n('Latitude'),Longitude:n('Longitude'),DistanceKm:n('DistanceKm'),
  OpeningTimes:g('OpeningTimes'),VisitDuration:g('VisitDuration'),Facilities:g('Facilities'),EntranceFee:g('EntranceFee'),TravelTips:g('TravelTips'),VisitorInfo:g('VisitorInfo'),ImagePath:g('ImagePath'),IsAvailable:$('#f_IsAvailable').checked};
 const r=editId?await api('/api/admin/attractions/'+editId,'PUT',b):await api('/api/admin/attractions','POST',b);
 msg(r.d.message,r.ok);if(r.ok){reset();load()}};
$('#rows').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.e){const a=rows.find(x=>x.AttractionId==b.dataset.e);editId=a.AttractionId;$('#ft').textContent='Edit: '+a.Name;
  F.concat(T).forEach(([k])=>$('#f_'+k).value=a[k]??'');$('#f_CategoryId').value=a.CategoryId;$('#f_IsAvailable').checked=!!a.IsAvailable;scrollTo(0,0)}
 if(b.dataset.x&&confirm('Delete this place permanently? It will also be removed from visitors\' plans.')){const r=await api('/api/admin/attractions/'+b.dataset.x,'DELETE');msg(r.d.message,r.ok);load()}};
load();
</script></body></html>
